[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amdb"
version = "0.1.0"
description = "Алгебраическая машина баз данных: OLAP на алгебре многомерных матриц"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Симаков В.А." }]
keywords = [
    "OLAP", "многомерные матрицы", "einsum", "тензоры", "гиперкуб",
    "алгебра Соколова", "база данных",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
hdf5 = ["h5py>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
gpu = ["torch>=2.0"]
sql = ["psycopg[binary]>=3.1", "clickhouse-driver>=0.2"]
bench = ["pandas>=2.0", "duckdb>=0.10"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pandas>=2.0",
    "h5py>=3.8",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
amdb = "amdb.api.cli:main"

[project.urls]
Homepage = "https://github.com/example/amdb"
Documentation = "https://github.com/example/amdb/tree/main/docs"

[tool.setuptools.packages.find]
include = ["amdb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
